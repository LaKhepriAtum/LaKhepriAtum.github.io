# 커리큘럼
#
# 월~목요일 글은 이 파일의 순서를 따른다. 진행 규칙은 CLAUDE.md의 "커리큘럼 글" 절에 있다.
#
# - 범위: 2017년 이후 논문을 기본으로 하고, 그 이전은 뒤의 논문을 읽는 데 꼭 필요한 것만 넣는다.
# - id: 글 머리말의 curriculum_id와 같은 값이다. "트랙id-이름" 형식이며, 한번 정하면 바꾸지 않는다.
# - requires: 먼저 글이 올라와 있어야 하는 다른 트랙의 항목이다. 같은 트랙 안에서는 위에서 아래 순서가 곧 선수 관계다.
# - 제목과 연도는 글을 쓸 때 원문과 다시 대조한다.

# base 트랙을 먼저 끝낸 뒤, 아래 순서로 트랙을 돌아가며 한 편씩 다룬다.
rotation: [nlp, vision, speech, rl, ts, agent, gen, mm, extra]

tracks:
  - id: base
    name: 공통 기초
    tag: theory
    description: 어느 분야로 가든 반복해서 나오는 개념입니다. 다른 트랙보다 먼저 끝냅니다.
    papers:
      - id: base-vae
        title: "Auto-Encoding Variational Bayes"
        short: VAE
        year: 2013
        why: 잠재 변수로 데이터를 생성하는 기본 틀입니다. 잠재 확산 모델과 오디오 코덱의 바탕이 됩니다.
      - id: base-gan
        title: "Generative Adversarial Nets"
        short: GAN
        year: 2014
        why: 생성기와 판별기를 겨루게 하는 학습 방식입니다. 음성 보코더와 코덱에서 지금도 쓰입니다.
      - id: base-attention
        title: "Neural Machine Translation by Jointly Learning to Align and Translate"
        short: Bahdanau Attention
        year: 2014
        why: 어텐션이 처음 등장한 논문입니다. Transformer가 무엇을 바꿨는지 이해하려면 필요합니다.
      - id: base-resnet
        title: "Deep Residual Learning for Image Recognition"
        short: ResNet
        year: 2015
        why: 잔차 연결은 이후 거의 모든 깊은 모델에 들어갑니다.
      - id: base-transformer
        title: "Attention Is All You Need"
        short: Transformer
        year: 2017
        why: 이후 모든 트랙의 공통 구조입니다.

  - id: nlp
    name: 언어
    tag: llm
    description: 사전학습 언어 모델에서 추론 모델까지, 지금의 LLM이 만들어진 순서를 따라갑니다.
    papers:
      - id: nlp-bert
        title: "BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding"
        short: BERT
        year: 2018
        why: 사전학습 후 미세조정이라는 방식을 표준으로 만들었습니다.
      - id: nlp-t5
        title: "Exploring the Limits of Transfer Learning with a Unified Text-to-Text Transformer"
        short: T5
        year: 2019
        why: 모든 과제를 텍스트 입출력으로 통일한 관점을 제시했습니다.
      - id: nlp-gpt3
        title: "Language Models are Few-Shot Learners"
        short: GPT-3
        year: 2020
        why: 미세조정 없이 프롬프트만으로 과제를 푸는 시대를 열었습니다.
      - id: nlp-rag
        title: "Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks"
        short: RAG
        year: 2020
        why: 검색을 붙여 모델이 모르는 지식을 보완하는 구조의 출발점입니다.
      - id: nlp-lora
        title: "LoRA: Low-Rank Adaptation of Large Language Models"
        short: LoRA
        year: 2021
        why: 큰 모델을 적은 비용으로 미세조정하는 표준 기법입니다.
      - id: nlp-cot
        title: "Chain-of-Thought Prompting Elicits Reasoning in Large Language Models"
        short: Chain-of-Thought
        year: 2022
        why: 풀이 과정을 쓰게 하면 추론이 좋아진다는 발견으로, 추론 모델의 뿌리입니다.
      - id: nlp-instructgpt
        title: "Training language models to follow instructions with human feedback"
        short: InstructGPT
        year: 2022
        why: 사람 피드백으로 모델을 지시에 맞게 다듬는 RLHF를 정착시켰습니다.
      - id: nlp-chinchilla
        title: "Training Compute-Optimal Large Language Models"
        short: Chinchilla
        year: 2022
        why: 모델 크기와 데이터 양을 어떻게 나눠야 하는지에 대한 기준을 제시했습니다.
      - id: nlp-llama
        title: "LLaMA: Open and Efficient Foundation Language Models"
        short: LLaMA
        year: 2023
        why: 공개 LLM 생태계의 출발점이며, 요즘 모델 구조의 기본형을 보여 줍니다.
      - id: nlp-mamba
        title: "Mamba: Linear-Time Sequence Modeling with Selective State Spaces"
        short: Mamba
        year: 2023
        why: Transformer가 아닌 대안 구조가 어디까지 왔는지 보여 줍니다.
      - id: nlp-deepseek-r1
        title: "DeepSeek-R1: Incentivizing Reasoning Capability in LLMs via Reinforcement Learning"
        short: DeepSeek-R1
        year: 2025
        why: 강화학습으로 추론 능력을 키우는 방법을 공개적으로 보여 준 사례입니다.

  - id: vision
    name: 이미지
    tag: vision
    description: 이미지 인식의 Transformer 전환, 자기지도학습, 범용 분할, 3차원 표현을 다룹니다.
    papers:
      - id: vision-vit
        title: "An Image is Worth 16x16 Words: Transformers for Image Recognition at Scale"
        short: ViT
        year: 2020
        why: 이미지를 패치 단위 토큰으로 다루는 방식의 출발점입니다.
      - id: vision-simclr
        title: "A Simple Framework for Contrastive Learning of Visual Representations"
        short: SimCLR
        year: 2020
        why: 대조 학습의 기본 구성을 가장 단순하게 정리했습니다.
      - id: vision-detr
        title: "End-to-End Object Detection with Transformers"
        short: DETR
        year: 2020
        why: 객체 검출을 집합 예측 문제로 바꿔 후처리를 없앴습니다.
      - id: vision-nerf
        title: "NeRF: Representing Scenes as Neural Radiance Fields for View Synthesis"
        short: NeRF
        year: 2020
        why: 신경망으로 3차원 장면을 표현하는 연구의 출발점입니다.
      - id: vision-mae
        title: "Masked Autoencoders Are Scalable Vision Learners"
        short: MAE
        year: 2021
        why: 가리고 복원하는 사전학습이 이미지에서도 통한다는 것을 보였습니다.
      - id: vision-dinov2
        title: "DINOv2: Learning Robust Visual Features without Supervision"
        short: DINOv2
        year: 2023
        why: 라벨 없이 학습한 범용 이미지 특징으로 널리 쓰입니다.
      - id: vision-sam
        title: "Segment Anything"
        short: SAM
        year: 2023
        why: 프롬프트로 무엇이든 분할하는 비전 파운데이션 모델입니다.
      - id: vision-3dgs
        title: "3D Gaussian Splatting for Real-Time Radiance Field Rendering"
        short: 3D Gaussian Splatting
        year: 2023
        why: NeRF의 느린 렌더링을 해결해 3차원 복원의 주류가 됐습니다.

  - id: speech
    name: 음성
    tag: speech
    description: 음성 합성, 음성 인식, 오디오 토큰화를 거쳐 음성 대화 모델까지 갑니다.
    papers:
      - id: speech-wavenet
        title: "WaveNet: A Generative Model for Raw Audio"
        short: WaveNet
        year: 2016
        why: 파형을 직접 생성하는 신경망 음성 합성의 출발점입니다.
      - id: speech-tacotron2
        title: "Natural TTS Synthesis by Conditioning WaveNet on Mel Spectrogram Predictions"
        short: Tacotron 2
        year: 2017
        why: 텍스트에서 멜 스펙트로그램을 거쳐 음성을 만드는 2단계 구조를 정착시켰습니다.
      - id: speech-wav2vec2
        title: "wav2vec 2.0: A Framework for Self-Supervised Learning of Speech Representations"
        short: wav2vec 2.0
        year: 2020
        why: 라벨 없는 음성으로 표현을 학습하는 방식의 기준이 됐습니다.
      - id: speech-hifigan
        title: "HiFi-GAN: Generative Adversarial Networks for Efficient and High Fidelity Speech Synthesis"
        short: HiFi-GAN
        year: 2020
        why: 빠르고 품질 좋은 보코더로 지금도 널리 쓰입니다.
      - id: speech-hubert
        title: "HuBERT: Self-Supervised Speech Representation Learning by Masked Prediction of Hidden Units"
        short: HuBERT
        year: 2021
        why: 음성을 이산 단위로 다루는 길을 열어 이후 음성 언어 모델의 기반이 됐습니다.
      - id: speech-soundstream
        title: "SoundStream: An End-to-End Neural Audio Codec"
        short: SoundStream
        year: 2021
        why: 오디오를 토큰으로 압축하는 신경망 코덱의 기본형입니다.
      - id: speech-audiolm
        title: "AudioLM: a Language Modeling Approach to Audio Generation"
        short: AudioLM
        year: 2022
        why: 오디오 토큰 위에서 언어 모델을 돌려 소리를 생성하는 방식을 제시했습니다.
      - id: speech-whisper
        title: "Robust Speech Recognition via Large-Scale Weak Supervision"
        short: Whisper
        year: 2022
        why: 대규모 약한 지도 데이터로 범용 음성 인식을 만든 사례입니다.
      - id: speech-valle
        title: "Neural Codec Language Models are Zero-Shot Text to Speech Synthesizers"
        short: VALL-E
        year: 2023
        why: 짧은 음성 예시만으로 목소리를 따라 하는 코덱 언어 모델 방식의 음성 합성입니다.
      - id: speech-moshi
        title: "Moshi: a speech-text foundation model for real-time dialogue"
        short: Moshi
        year: 2024
        why: 듣기와 말하기를 동시에 하는 실시간 음성 대화 모델입니다.

  - id: rl
    name: 강화학습과 로보틱스
    tag: rl
    description: 가치 기반과 정책 기반 방법, 모델 기반 계획, 오프라인 학습을 거쳐 로봇 정책까지 갑니다.
    papers:
      - id: rl-dqn
        title: "Playing Atari with Deep Reinforcement Learning"
        short: DQN
        year: 2013
        why: 심층 강화학습의 출발점입니다. 경험 재생 같은 기본 장치가 여기서 나옵니다.
      - id: rl-ppo
        title: "Proximal Policy Optimization Algorithms"
        short: PPO
        year: 2017
        why: 가장 널리 쓰이는 정책 경사 알고리즘이며, LLM 학습에도 쓰였습니다.
      - id: rl-alphazero
        title: "Mastering Chess and Shogi by Self-Play with a General Reinforcement Learning Algorithm"
        short: AlphaZero
        year: 2017
        why: 자기 대국과 탐색을 결합해 사람의 기보 없이 학습한 사례입니다.
      - id: rl-sac
        title: "Soft Actor-Critic: Off-Policy Maximum Entropy Deep Reinforcement Learning with a Stochastic Actor"
        short: SAC
        year: 2018
        why: 연속 제어에서 표준으로 쓰이는 오프폴리시 알고리즘입니다.
      - id: rl-world-models
        title: "World Models"
        short: World Models
        year: 2018
        why: 환경을 모델로 학습하고 그 안에서 정책을 훈련한다는 생각의 출발점입니다.
      - id: rl-muzero
        title: "Mastering Atari, Go, Chess and Shogi by Planning with a Learned Model"
        short: MuZero
        year: 2019
        why: 규칙을 모르는 상태에서 학습한 모델로 계획하는 방법을 보였습니다.
      - id: rl-cql
        title: "Conservative Q-Learning for Offline Reinforcement Learning"
        short: CQL
        year: 2020
        why: 이미 쌓인 데이터만으로 학습하는 오프라인 강화학습의 대표 기법입니다.
      - id: rl-decision-transformer
        title: "Decision Transformer: Reinforcement Learning via Sequence Modeling"
        short: Decision Transformer
        year: 2021
        why: 강화학습을 시퀀스 예측 문제로 바꿔 본 논문입니다.
      - id: rl-dreamerv3
        title: "Mastering Diverse Domains through World Models"
        short: DreamerV3
        year: 2023
        why: 하나의 설정으로 다양한 환경을 푸는 월드 모델 기반 에이전트입니다.
      - id: rl-diffusion-policy
        title: "Diffusion Policy: Visuomotor Policy Learning via Action Diffusion"
        short: Diffusion Policy
        year: 2023
        requires: [gen-ddpm]
        why: 확산 모델로 로봇 행동을 생성하는 방식으로, 로봇 모방학습의 주류가 됐습니다.
      - id: rl-rt2
        title: "RT-2: Vision-Language-Action Models Transfer Web Knowledge to Robotic Control"
        short: RT-2
        year: 2023
        requires: [mm-clip]
        why: 비전 언어 모델을 로봇 제어로 확장한 VLA 모델의 출발점입니다.

  - id: ts
    name: 시계열
    tag: time-series
    description: 딥러닝 예측 모델에서 Transformer 논쟁을 거쳐 시계열 파운데이션 모델까지 갑니다.
    papers:
      - id: ts-deepar
        title: "DeepAR: Probabilistic Forecasting with Autoregressive Recurrent Networks"
        short: DeepAR
        year: 2017
        why: 여러 시계열을 한 모델로 학습해 확률 예측을 하는 방식의 기준입니다.
      - id: ts-nbeats
        title: "N-BEATS: Neural basis expansion analysis for interpretable time series forecasting"
        short: N-BEATS
        year: 2019
        why: 순수 딥러닝 모델이 통계 기법을 넘어선 초기 사례입니다.
      - id: ts-tft
        title: "Temporal Fusion Transformers for Interpretable Multi-horizon Time Series Forecasting"
        short: TFT
        year: 2019
        why: 여러 종류의 입력 변수를 다루는 실무형 예측 모델입니다.
      - id: ts-informer
        title: "Informer: Beyond Efficient Transformer for Long Sequence Time-Series Forecasting"
        short: Informer
        year: 2020
        why: 장기 예측용 Transformer 연구의 출발점입니다.
      - id: ts-autoformer
        title: "Autoformer: Decomposition Transformers with Auto-Correlation for Long-Term Series Forecasting"
        short: Autoformer
        year: 2021
        why: 추세와 계절성 분해를 모델 구조 안에 넣었습니다.
      - id: ts-dlinear
        title: "Are Transformers Effective for Time Series Forecasting?"
        short: DLinear
        year: 2022
        why: 단순한 선형 모델이 Transformer를 이긴다는 반론으로 분야의 방향을 바꿨습니다.
      - id: ts-patchtst
        title: "A Time Series is Worth 64 Words: Long-term Forecasting with Transformers"
        short: PatchTST
        year: 2022
        why: 패치 단위 입력으로 Transformer의 성능을 되살렸습니다.
      - id: ts-itransformer
        title: "iTransformer: Inverted Transformers Are Effective for Time Series Forecasting"
        short: iTransformer
        year: 2023
        why: 시점이 아니라 변수를 토큰으로 삼는 발상의 전환을 보였습니다.
      - id: ts-timesfm
        title: "A decoder-only foundation model for time-series forecasting"
        short: TimesFM
        year: 2023
        why: 사전학습만으로 새 데이터를 예측하는 시계열 파운데이션 모델입니다.
      - id: ts-chronos
        title: "Chronos: Learning the Language of Time Series"
        short: Chronos
        year: 2024
        requires: [nlp-t5]
        why: 시계열을 토큰으로 바꿔 언어 모델 구조로 학습한 파운데이션 모델입니다.

  - id: agent
    name: 에이전트
    tag: llm
    description: LLM이 도구를 쓰고, 기억하고, 실제 코드 작업을 수행하기까지의 흐름입니다.
    papers:
      - id: agent-react
        title: "ReAct: Synergizing Reasoning and Acting in Language Models"
        short: ReAct
        year: 2022
        requires: [nlp-gpt3]
        why: 생각과 행동을 번갈아 하는 에이전트 루프의 기본형입니다.
      - id: agent-toolformer
        title: "Toolformer: Language Models Can Teach Themselves to Use Tools"
        short: Toolformer
        year: 2023
        why: 모델이 스스로 도구 호출을 배우게 한 초기 연구입니다.
      - id: agent-reflexion
        title: "Reflexion: Language Agents with Verbal Reinforcement Learning"
        short: Reflexion
        year: 2023
        why: 실패를 말로 되돌아보고 다음 시도에 반영하는 방식입니다.
      - id: agent-generative-agents
        title: "Generative Agents: Interactive Simulacra of Human Behavior"
        short: Generative Agents
        year: 2023
        why: 기억, 회고, 계획으로 이뤄진 에이전트 구조를 제시했습니다.
      - id: agent-voyager
        title: "Voyager: An Open-Ended Embodied Agent with Large Language Models"
        short: Voyager
        year: 2023
        why: 익힌 기술을 코드로 쌓아 가며 계속 학습하는 에이전트입니다.
      - id: agent-expel
        title: "ExpeL: LLM Agents Are Experiential Learners"
        short: ExpeL
        year: 2023
        why: 과거 실행에서 교훈을 뽑아 쓰는 메모리 방식으로, 이후 메모리 연구의 비교 기준입니다.
      - id: agent-memgpt
        title: "MemGPT: Towards LLMs as Operating Systems"
        short: MemGPT
        year: 2023
        why: 한정된 컨텍스트를 운영체제의 메모리처럼 관리하는 발상입니다.
      - id: agent-swe-bench
        title: "SWE-bench: Can Language Models Resolve Real-World GitHub Issues?"
        short: SWE-bench
        year: 2023
        why: 코딩 에이전트 평가의 표준이 된 벤치마크입니다.
      - id: agent-swe-agent
        title: "SWE-agent: Agent-Computer Interfaces Enable Automated Software Engineering"
        short: SWE-agent
        year: 2024
        why: 에이전트에게 주는 도구와 인터페이스 설계가 성능을 좌우한다는 것을 보였습니다.

  - id: gen
    name: 이미지와 영상 생성
    tag: vision
    description: 확산 모델의 기초에서 잠재 확산, Transformer 기반 확산, 영상 생성까지 갑니다.
    papers:
      - id: gen-ddpm
        title: "Denoising Diffusion Probabilistic Models"
        short: DDPM
        year: 2020
